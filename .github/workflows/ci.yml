name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - name: Browser integration test
        run: |
          pnpm --filter @wisemen/nestjs-brand-extraction exec playwright-core install --with-deps chromium
          pnpm --filter @wisemen/nestjs-brand-extraction test:browser
